services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devspace
      POSTGRES_PASSWORD: devspace
      POSTGRES_DB: devspace
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devspace -d devspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../api
    environment:
      DATABASE_URL: postgresql+psycopg://devspace:devspace@postgres:5432/devspace
      DATABASE_URL_UNPOOLED: postgresql+psycopg://devspace:devspace@postgres:5432/devspace
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../api:/app
      - ../curriculum:/curriculum:ro

  worker:
    build:
      context: ../worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://devspace:devspace@postgres:5432/devspace
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
